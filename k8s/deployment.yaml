apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegram-chat-backend
  namespace: telegram-chat
  labels:
    app.kubernetes.io/name: telegram-chat-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: js-chat-telegram-widget
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: telegram-chat-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telegram-chat-backend
        app.kubernetes.io/component: backend
    spec:
      securityContext:
        fsGroup: 10001
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
      containers:
        - name: backend
          image: ghcr.io/timothechauvet/js-chat-telegram-widget-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: telegram-chat-backend-config
            - secretRef:
                name: telegram-chat-backend-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: data-volume
              mountPath: /data
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: telegram-chat-backend-data
