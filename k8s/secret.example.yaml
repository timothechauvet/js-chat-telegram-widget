apiVersion: v1
kind: Secret
metadata:
  name: telegram-chat-backend-secret
  namespace: telegram-chat
  labels:
    app.kubernetes.io/name: telegram-chat-backend
    app.kubernetes.io/part-of: js-chat-telegram-widget
type: Opaque
stringData:
  # Replace with your real Telegram credentials and tokens
  TELEGRAM_BOT_TOKEN: "YOUR_TELEGRAM_BOT_TOKEN"
  TELEGRAM_WEBHOOK_SECRET: "your-random-webhook-secret-token"
  TELEGRAM_AUTH_SECRET: "your-admin-auth-secret-key"
  BACKEND_SECRET_KEY: "your-internal-secret-token"
